# Стандартные бинды из oh-my-tmux (https://github.com/gpakosz/.tmux),
# адаптированные под этот конфиг (без .tmux.conf.local и его служебных
# переменных TMUX_CONF/TMUX_CONF_LOCAL/TMUX_PROGRAM — путь к конфигу и
# редактор подставлены напрямую).

# -- навигация --------------------------------------------------------------
bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind BTab switch-client -l                              # на последнюю сессию

bind - split-window -v
bind _ split-window -h

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind > swap-pane -D
bind < swap-pane -U

bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

unbind n
unbind p
bind -r C-h previous-window
bind -r C-l next-window
bind -r C-S-H swap-window -t -1 \; select-window -t -1
bind -r C-S-L swap-window -t +1 \; select-window -t +1
bind Tab last-window

# toggle mouse (в оригинале зовёт функцию _toggle_mouse из тела
# .tmux.conf — здесь такого скрипта нет, поэтому логика продублирована
# напрямую через #{mouse})
bind m if -F '#{mouse}' 'set -g mouse off' 'set -g mouse on' \; display 'mouse #{?mouse,on,off}'

# reload / edit config (в оригинале работает через $TMUX_CONF /
# $TMUX_CONF_LOCAL — здесь путь к конфигу этого репозитория прописан явно)
bind r source-file ~/.config/tmux/tmux.conf \; display 'tmux.conf sourced'
bind e new-window -n tmux.conf 'sh -c "${EDITOR:-vim} ~/.config/tmux/tmux.conf"'

bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# -- copy mode ----------------------------------------------------------------
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# -- буферы -----------------------------------------------------------------
# p/P заняты плагином tmux-floax (@floax-bind), поэтому paste/choose-buffer
# повешены на стоковые клавиши vanilla tmux вместо оригинальных oh-my-tmux p/P
bind b list-buffers
bind ] paste-buffer -p
bind = choose-buffer -Z

